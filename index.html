 let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;save()});
addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.e){e.preventDefault();e.target.blur()}});
addEventListener("focusout",e=>{if(ED&&e.target.dataset&&e.target.dataset.e){document.title=D.profile.name+" - Portfolio";$(".logo").textContent=D.profile.name;$("#fn").textContent=D.profile.name}});
async function pub(){let g=null;try{g=JSON.parse(localStorage.getItem("gh"))}catch(e){}
 if(!g){const r=prompt("GitHub repository (owner/name), e.g. orjun/portfolio:");if(!r)return;const tk=prompt("GitHub fine-grained token (Contents: read and write, for this repo only):");if(!tk)return;g={r:r.trim(),tk:tk.trim()};try{localStorage.setItem("gh",JSON.stringify(g))}catch(e){}}
 const u=`https://api.github.com/repos/${g.r}/contents/data.json`,h={Authorization:"Bearer "+g.tk,Accept:"application/vnd.github+json"};
 try{let sha;const c=await fetch(u,{headers:h});if(c.ok)sha=(await c.json()).sha;
  const r=await fetch(u,{method:"PUT",headers:h,body:JSON.stringify({message:"Update portfolio content",sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1))))})});
  if(r.ok)toast("Published. It goes live in about a minute.");else{if(r.status==401||r.status==404)try{localStorage.removeItem("gh")}catch(e){}toast("Publish failed ("+r.status+"). Check the repo name and token, then try again.")}
 }catch(e){toast("Network error. Check your connection and try again.")}}

/* ================= MULTI-PHOTO PROJECTS ================= */
const OK={};let GA=[],GI=0;
function okImgs(x){const u=[x.img,...(x.imgs||[])].filter(Boolean),k=u.join("|");
 return OK[k]||(OK[k]=Promise.all(u.map(s=>new Promise(r=>{const m=new Image();m.onload=()=>r(s);m.onerror=()=>r(null);m.src=s}))).then(a=>a.filter(Boolean)))}
function badges(){(D.projects||[]).forEach((x,i)=>okImgs(x).then(a=>{if(a.length>1){const c=document.querySelector(`.pc[data-i="${i}"] .pimg`);if(c&&!c.querySelector(".bdg"))c.insertAdjacentHTML("beforeend",`<span class="bdg">${a.length} photos</span>`)}}))}
function gt(j){GI=j;const m=$("#mi");let im=m.querySelector("img");if(!im){im=new Image();im.alt="";m.prepend(im)}im.src=GA[j];document.querySelectorAll(".th2 img").forEach((t,n)=>t.classList.toggle("on",n==j))}
function gs(d){gt((GI+d+GA.length)%GA.length)}
addEventListener("keydown",e=>{if($("#md").classList.contains("open")&&GA.length>1){if(e.key=="ArrowRight")gs(1);if(e.key=="ArrowLeft")gs(-1)}});
function rm(s,i,k,j){own(s,i)[k].splice(j,1);save();render();adm()}
function addp(s,i,k,inp){const v=inp.value.trim();if(!v)return;const o=own(s,i);(o[k]=o[k]||[]).push(v);save();render();adm()}
function rs(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*m;c.height=im.height*m;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.8))};im.src=fr.result};fr.readAsDataURL(f)})}
async function upm(s,i,k,inp){const o=own(s,i);o[k]=o[k]||[];for(const f of inp.files)o[k].push(await rs(f));save();render();adm()}
load().then(()=>{if(!D.skillGroups)D.skillGroups=D0.skillGroups;if(D.profile.status===undefined)D.profile.status=D0.profile.status;D.projects.forEach(x=>{if(!x.imgs&&x.img)x.imgs=[2,3,4].map(n=>x.img.replace(/(\.\w+)$/,"-"+n+"$1"))});render()});
